# =====================================================================
# Grafana dashboard provisioning — Phase 5 (Step 5.2)
# =====================================================================
apiVersion: 1

providers:
  - name: "PSO Traffic Dashboards"
    orgId: 1
    folder: "PSO Traffic"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
