<!DOCTYPE html>
<!--
=====================================================================
 PSO Smart Traffic — Mobile Web Client (Phase 5, Step 5.5)
=====================================================================
 Self-contained commuter page consuming the public /api/mobile/*
 endpoints. No build step required.

 Served at:  GET /mobile
 Endpoints used:
   GET /api/mobile/status      — live counts, timings, congestion
   GET /api/mobile/incidents   — incident feed
   GET /api/mobile/travel-time — ETA estimator
=====================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>PSO Traffic — Live</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #263449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      max-width: 560px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
    }
    .live-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
    }
    .live-pill.on .dot { background: var(--green); animation: pulse 2s infinite; }
    .live-pill.on { color: var(--green); }
    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; }
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .counts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .dir {
      background: var(--card-2);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .dir .n { font-size: 1.3rem; font-weight: 700; }
    .dir .d { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; }
    .timings {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .timing {
      background: var(--card-2);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }
    .timing .v { font-size: 1rem; font-weight: 700; color: var(--green); }
    .timing .d { font-size: 0.65rem; color: var(--muted); }
    .horizons {
      display: flex;
      gap: 8px;
    }
    .horizon {
      flex: 1;
      background: var(--card-2);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .horizon .lvl { font-weight: 700; font-size: 0.95rem; }
    .horizon .lvl.LOW { color: var(--green); }
    .horizon .lvl.MEDIUM { color: var(--amber); }
    .horizon .lvl.HIGH { color: var(--red); }
    .horizon .m { font-size: 0.68rem; color: var(--muted); }
    .horizon .t { font-size: 0.72rem; color: var(--text); margin-top: 2px; }
    .eta-row {
      display: flex;
      gap: 8px;
    }
    .eta-row input {
      flex: 1;
      background: var(--card-2);
      border: 1px solid #334155;
      border-radius: 10px;
      color: var(--text);
      padding: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    .eta-row input:focus { border-color: var(--blue); }
    .eta-row button {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .eta-result {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 1.3em;
    }
    .eta-result strong { color: var(--text); font-size: 1.1rem; }
    .incident {
      background: var(--card-2);
      border-left: 3px solid var(--amber);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .incident.severity-HIGH { border-left-color: var(--red); }
    .incident.severity-LOW { border-left-color: var(--green); }
    .incident .t { font-weight: 600; font-size: 0.85rem; }
    .incident .m { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .incident .w { font-size: 0.68rem; color: var(--muted); margin-top: 4px; opacity: 0.7; }
    .empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 8px; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚦 PSO Traffic</h1>
    <span class="live-pill" id="livePill"><span class="dot"></span><span id="liveLabel">connecting…</span></span>
  </header>

  <div class="card">
    <h2>Intersection <span id="intersectionId">—</span></h2>
    <div class="counts" id="counts">
      <div class="dir"><div class="n">—</div><div class="d">North</div></div>
      <div class="dir"><div class="n">—</div><div class="d">South</div></div>
      <div class="dir"><div class="n">—</div><div class="d">East</div></div>
      <div class="dir"><div class="n">—</div><div class="d">West</div></div>
    </div>
    <div class="timings" id="timings">
      <div class="timing"><div class="v">—</div><div class="d">N green</div></div>
      <div class="timing"><div class="v">—</div><div class="d">S green</div></div>
      <div class="timing"><div class="v">—</div><div class="d">E green</div></div>
      <div class="timing"><div class="v">—</div><div class="d">W green</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Congestion Forecast</h2>
    <div class="horizons" id="horizons">
      <div class="horizon"><div class="lvl">—</div><div class="m">5 min</div><div class="t"></div></div>
      <div class="horizon"><div class="lvl">—</div><div class="m">10 min</div><div class="t"></div></div>
      <div class="horizon"><div class="lvl">—</div><div class="m">15 min</div><div class="t"></div></div>
    </div>
  </div>

  <div class="card">
    <h2>Travel Time Estimator</h2>
    <div class="eta-row">
      <input type="number" id="distance" placeholder="Distance (km)" min="0.1" step="0.1" value="5" />
      <button onclick="estimate()">Estimate</button>
    </div>
    <div class="eta-result" id="etaResult"></div>
  </div>

  <div class="card">
    <h2>Incidents</h2>
    <div id="incidents"><div class="empty">No incidents reported</div></div>
  </div>

  <footer>
    Updated <span id="updatedAt">—</span> · refresh 10s · PSO Smart Traffic
  </footer>

  <script>
    const REFRESH_MS = 10000;
    let etaLevel = "LOW";

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const body = await res.json();
      if (!body.success) throw new Error(body.message || "API error");
      return body.data;
    }

    function setLive(on, label) {
      const pill = document.getElementById("livePill");
      pill.classList.toggle("on", !!on);
      document.getElementById("liveLabel").textContent =
        label || (on ? "live" : "offline");
    }

    function renderStatus(data) {
      const inter = data.intersection || {};
      document.getElementById("intersectionId").textContent =
        inter.id || "—";

      const counts = inter.counts || {};
      const order = ["north", "south", "east", "west"];
      document.querySelectorAll("#counts .dir .n").forEach((el, i) => {
        const v = counts[order[i]];
        el.textContent = (v === undefined || v === null) ? "—" : Math.round(v);
      });

      const timings = inter.timings || {};
      document.querySelectorAll("#timings .timing .v").forEach((el, i) => {
        const key = ["north_green", "south_green", "east_green", "west_green"][i];
        const v = timings[key];
        el.textContent = (v === undefined || v === null) ? "—" : Math.round(v) + "s";
      });

      const horizons = data.congestion_horizons || {};
      const panels = document.querySelectorAll("#horizons .horizon");
      ["5", "10", "15"].forEach((m, i) => {
        const h = horizons[m];
        const lvlEl = panels[i].querySelector(".lvl");
        const tEl = panels[i].querySelector(".t");
        if (h) {
          lvlEl.textContent = h.level;
          lvlEl.className = "lvl " + h.level;
          tEl.textContent = "~" + Math.round(h.predicted_total) + " veh";
          if (i === 0) etaLevel = h.level;
        } else {
          lvlEl.textContent = "—";
          lvlEl.className = "lvl";
          tEl.textContent = "";
        }
      });

      setLive(!!data.live);
      document.getElementById("updatedAt").textContent =
        new Date().toLocaleTimeString();
    }

    function renderIncidents(data) {
      const wrap = document.getElementById("incidents");
      const items = data.incidents || [];
      if (!items.length) {
        wrap.innerHTML = '<div class="empty">No incidents reported</div>';
        return;
      }
      wrap.innerHTML = items.map((inc) => `
        <div class="incident severity-${inc.severity || "LOW"}">
          <div class="t">${escapeHTML(inc.type)} · ${escapeHTML(inc.severity || "")}</div>
          <div class="m">${escapeHTML(inc.message || "")}</div>
          <div class="w">${new Date(inc.reported_at).toLocaleString()}</div>
        </div>`).join("");
    }

    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function estimate() {
      const km = parseFloat(document.getElementById("distance").value);
      const out = document.getElementById("etaResult");
      if (!km || km <= 0) {
        out.textContent = "Enter a valid distance.";
        return;
      }
      try {
        const data = await fetchJSON(
          `/api/mobile/travel-time?distance_km=${km}&congestion=${etaLevel}`
        );
        out.innerHTML = `≈ <strong>${data.eta_minutes} min</strong>` +
          ` <span style="opacity:.6">(${data.distance_km} km @ ${data.congestion_level},` +
          ` ~${data.assumed_speed_kmh} km/h)</span>`;
      } catch (e) {
        out.textContent = "Estimate unavailable: " + e.message;
      }
    }

    async function refresh() {
      try {
        const status = await fetchJSON("/api/mobile/status");
        renderStatus(status);
      } catch (e) {
        setLive(false, "offline");
      }
      try {
        const incidents = await fetchJSON("/api/mobile/incidents?limit=5");
        renderIncidents(incidents);
      } catch (e) { /* keep previous */ }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
