# =====================================================================
# Nginx — Reverse Proxy Configuration
# =====================================================================
# Sits in front of gunicorn (port 5000). Add TLS via certbot:
#   sudo certbot --nginx -d your-domain.com
# =====================================================================

upstream pso_traffic_app {
    server app:5000;          # docker-compose service name
    # server 127.0.0.1:5000; # bare-metal deployment
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.com;

    # Larger uploads for dataset endpoints
    client_max_body_size 50M;

    location / {
        proxy_pass http://pso_traffic_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;  # required for MJPEG camera streams
    }

    # Camera MJPEG stream needs long/no buffering
    location /api/camera/frame {
        proxy_pass http://pso_traffic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # WebSocket (Socket.IO) support
    location /socket.io/ {
        proxy_pass http://pso_traffic_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}